<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Przymierz Znicz</title>

  <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/bundle.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { font-size: 1.3rem; margin-bottom: 12px; font-weight: 700; }

    .step-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .btn:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
    .btn-ai { background: #7c3aed; }
    .btn-download { background: #16a34a; }
    
    input[type="file"] { display: none; }

    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 12px;
      min-height: 22px;
      text-align: center;
    }

    #canvas-container {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 3 / 4;
      background: #1f2937;
      border: 2px dashed #374151;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .controls {
      width: 100%;
      max-width: 440px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .slider-row input { width: 65%; accent-color: #2563eb; }
  </style>
</head>
<body>

  <h1>Wizualizator Znicza</h1>

  <div class="step-container">
    <!-- Krok 1: Nagrobek -->
    <label class="btn" for="input-grave" id="btn-grave-label">
      📸 1. Dodaj zdjęcie nagrobka
    </label>
    <input type="file" id="input-grave" accept="image/*">

    <!-- Krok 2: Znicz (odblokowuje się po kroku 1) -->
    <label class="btn" for="input-candle" id="btn-candle-label" style="display: none; background: #0284c7;">
      🕯️ 2. Wybierz lub zrób zdjęcie znicza
    </label>
    <input type="file" id="input-candle" accept="image/*" capture="environment">
  </div>

  <div id="status">Wgraj zdjęcie nagrobka, aby rozpocząć.</div>

  <div id="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <!-- Panel dostosowania i generowania AI -->
  <div class="controls" id="edit-controls" style="display: none;">
    <div class="slider-row">
      <label for="scale-slider">Wielkość znicza:</label>
      <input type="range" id="scale-slider" min="0.1" max="1.5" step="0.05" value="0.45">
    </div>

    <button class="btn btn-ai" id="inpaint-btn">✨ Generuj realistyczną wizualizację (AI)</button>
    <button class="btn btn-download" id="download-btn">💾 Pobierz zdjęcie</button>
  </div>

  <script>
    // WKLEJ TUTAJ ADRES SWOJEGO WORKERA Z KROKU 1:
    const WORKER_URL = "https://twoj-worker.twojanazwa.workers.dev";

    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const inputGrave = document.getElementById('input-grave');
    const inputCandle = document.getElementById('input-candle');
    const btnCandleLabel = document.getElementById('btn-candle-label');
    const editControls = document.getElementById('edit-controls');
    const inpaintBtn = document.getElementById('inpaint-btn');
    const downloadBtn = document.getElementById('download-btn');
    const scaleSlider = document.getElementById('scale-slider');

    let graveImg = null;
    let candleCutImg = null;

    let candleState = {
      x: 0,
      y: 0,
      scale: 0.45,
      isDragging: false
    };

    // 1. Dodanie zdjęcia nagrobka
    inputGrave.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      graveImg = new Image();
      graveImg.onload = () => {
        canvas.width = graveImg.naturalWidth;
        canvas.height = graveImg.naturalHeight;
        render();

        btnCandleLabel.style.display = 'block';
        statusEl.innerText = "Nagrobek wczytany! Teraz dodaj lub zrób zdjęcie znicza.";
      };
      graveImg.src = url;
    });

    // 2. Dodanie zdjęcia znicza + AI wycinanie w locie
    inputCandle.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.innerText = "⏳ AI precyzyjnie wycina znicz z tła...";
      btnCandleLabel.style.pointerEvents = 'none';

      try {
        const blob = await imglyRemoveBackground(file);
        const cutUrl = URL.createObjectURL(blob);

        candleCutImg = new Image();
        candleCutImg.onload = () => {
          candleState.x = canvas.width / 2;
          candleState.y = canvas.height * 0.65;
          editControls.style.display = 'flex';
          statusEl.innerText = "Ustaw znicz palcem w odpowiednim miejscu na płycie nagrobka.";
          render();
          btnCandleLabel.style.pointerEvents = 'auto';
        };
        candleCutImg.src = cutUrl;
      } catch (err) {
        statusEl.innerText = "Nie udało się wyciąć tła. Spróbuj innego zdjęcia.";
        btnCandleLabel.style.pointerEvents = 'auto';
      }
    });

    // Rysowanie na canvasie
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (graveImg) {
        ctx.drawImage(graveImg, 0, 0, canvas.width, canvas.height);
      }

      if (candleCutImg) {
        const w = candleCutImg.naturalWidth * candleState.scale;
        const h = candleCutImg.naturalHeight * candleState.scale;
        const drawX = candleState.x - w / 2;
        const drawY = candleState.y - h / 2;

        ctx.drawImage(candleCutImg, drawX, drawY, w, h);
      }
    }

    // 3. Generowanie podglądu przez Cloudflare AI
    inpaintBtn.addEventListener('click', async () => {
      if (!candleCutImg) return;

      statusEl.innerText = "⏳ AI wtapia znicz w nagrobek (światło, cienie i odbicia)...";
      inpaintBtn.disabled = true;

      try {
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = canvas.width;
        maskCanvas.height = canvas.height;
        const mCtx = maskCanvas.getContext('2d');
        mCtx.fillStyle = '#000000';
        mCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);

        const w = candleCutImg.naturalWidth * candleState.scale;
        const h = candleCutImg.naturalHeight * candleState.scale;
        const drawX = candleState.x - w / 2;
        const drawY = candleState.y - h / 2;

        mCtx.fillStyle = '#ffffff';
        mCtx.fillRect(drawX, drawY, w, h);

        const [origBlob, maskBlob] = await Promise.all([
          new Promise(r => canvas.toBlob(r, 'image/png')),
          new Promise(r => maskCanvas.toBlob(r, 'image/png'))
        ]);

        const formData = new FormData();
        formData.append('image', origBlob);
        formData.append('mask', maskBlob);

        const res = await fetch(WORKER_URL, {
          method: 'POST',
          body: formData
        });

        if (!res.ok) throw new Error("Błąd serwera AI");

        const resultBlob = await res.blob();
        const resultImg = new Image();
        resultImg.onload = () => {
          graveImg = resultImg;
          candleCutImg = null;
          render();
          statusEl.innerText = "Gotowe! Możesz teraz pobrać wizualizację.";
          inpaintBtn.disabled = false;
        };
        resultImg.src = URL.createObjectURL(resultBlob);

      } catch (err) {
        statusEl.innerText = "Błąd generowania AI. Spróbuj ponownie.";
        inpaintBtn.disabled = false;
      }
    });

    scaleSlider.addEventListener('input', (e) => {
      candleState.scale = parseFloat(e.target.value);
      render();
    });

    function getCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('touchstart', (e) => {
      if (!candleCutImg) return;
      const pos = getCoords(e.touches[0].clientX, e.touches[0].clientY);
      candleState.isDragging = true;
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!candleState.isDragging) return;
      e.preventDefault();
      const pos = getCoords(e.touches[0].clientX, e.touches[0].clientY);
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    }, { passive: false });

    canvas.addEventListener('touchend', () => { candleState.isDragging = false; });

    canvas.addEventListener('mousedown', (e) => {
      if (!candleCutImg) return;
      const pos = getCoords(e.clientX, e.clientY);
      candleState.isDragging = true;
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    });

    window.addEventListener('mousemove', (e) => {
      if (!candleState.isDragging) return;
      const pos = getCoords(e.clientX, e.clientY);
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    });

    window.addEventListener('mouseup', () => { candleState.isDragging = false; });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'nagrobek-wizualizacja.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });
  </script>
</body>
</html>
