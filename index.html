<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wizualizator Znicza</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 12px; font-weight: 700; text-align: center; }

    .step-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn-candle { background: #0284c7; }
    .btn-ai { background: #9333ea; }
    .btn-download { background: #16a34a; }
    .btn-undo { background: #475569; }

    input[type="file"] { display: none; }

    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 12px;
      min-height: 22px;
      text-align: center;
      word-break: break-word;
      padding: 0 8px;
    }

    #canvas-container {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 3 / 4;
      background: #1e293b;
      border: 2px dashed #334155;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .controls {
      width: 100%;
      max-width: 440px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
    }
    #sliders { display: flex; flex-direction: column; gap: 12px; }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .slider-row input { width: 55%; accent-color: #4f46e5; }
  </style>
</head>
<body>

  <h1>Wizualizator Znicza</h1>

  <div class="step-container">
    <label class="btn" for="input-grave" id="btn-grave-label">
      📸 1. Dodaj zdjęcie nagrobka
    </label>
    <input type="file" id="input-grave" accept="image/*">

    <div id="candle-buttons" style="display: none; gap: 10px;">
      <label class="btn btn-candle" for="input-candle-camera" style="flex: 1;">
        📷 2. Zrób zdjęcie znicza
      </label>
      <label class="btn btn-candle" for="input-candle" style="flex: 1;">
        🖼️ 2. Z galerii
      </label>
    </div>
    <input type="file" id="input-candle-camera" accept="image/*" capture="environment">
    <input type="file" id="input-candle" accept="image/*">
  </div>

  <div id="status">Wgraj zdjęcie nagrobka, aby rozpocząć.</div>

  <div id="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <div class="controls" id="edit-controls" style="display: none;">
    <div id="sliders">
      <div class="slider-row">
        <label for="scale-slider">Wielkość znicza:</label>
        <input type="range" id="scale-slider" min="0.05" max="1.5" step="0.01" value="0.3">
      </div>
      <div class="slider-row">
        <label for="reflect-slider">Odbicie w płycie:</label>
        <input type="range" id="reflect-slider" min="0" max="0.5" step="0.05" value="0.25">
      </div>
      <div class="slider-row">
        <label for="strength-slider">Siła AI (cień/odbicie):</label>
        <input type="range" id="strength-slider" min="0.2" max="0.8" step="0.05" value="0.5">
      </div>
      <div class="slider-row">
        <label for="realism-slider">Realizm AI (wtopienie znicza):</label>
        <input type="range" id="realism-slider" min="0" max="0.7" step="0.05" value="0.4">
      </div>
    </div>

    <button class="btn btn-ai" id="inpaint-btn">✨ Fotorealistyczna wizualizacja AI</button>
    <button class="btn btn-undo" id="undo-btn" style="display: none;">↩️ Cofnij AI (wróć do edycji)</button>
    <button class="btn btn-download" id="download-btn">💾 Pobierz zdjęcie</button>
  </div>

  <script>
    const AI_URL = "https://znicz-ai-proxy.maxfunnn.workers.dev";
    const BGREMOVAL_URL = "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";
    const MAX_GRAVE = 1600;   // maks. dłuższy bok zdjęcia nagrobka
    const MAX_CANDLE = 1024;  // maks. dłuższy bok zdjęcia znicza przed wycięciem

    const statusEl = document.getElementById('status');
    const container = document.getElementById('canvas-container');
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const inputGrave = document.getElementById('input-grave');
    const inputCandle = document.getElementById('input-candle');
    const candleButtons = document.getElementById('candle-buttons');
    const inputCandleCamera = document.getElementById('input-candle-camera');
    const editControls = document.getElementById('edit-controls');
    const slidersBox = document.getElementById('sliders');
    const inpaintBtn = document.getElementById('inpaint-btn');
    const undoBtn = document.getElementById('undo-btn');
    const downloadBtn = document.getElementById('download-btn');

    const scaleSlider = document.getElementById('scale-slider');
    const reflectSlider = document.getElementById('reflect-slider');
    const strengthSlider = document.getElementById('strength-slider');
    const realismSlider = document.getElementById('realism-slider');

    let graveCanvas = null;   // czyste zdjęcie nagrobka
    let candleCut = null;     // wycięty znicz (canvas z przezroczystością, przycięty)
    let resultCanvas = null;  // wynik po AI

    const state = { x: 0, y: 0, scale: 0.3, reflect: 0.25, isDragging: false };

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Nie udało się wczytać zdjęcia"));
        img.src = url;
      });
    }

    // ---------- 1. Nagrobek ----------
    inputGrave.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const img = await loadImage(file);
        const k = Math.min(1, MAX_GRAVE / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * k);
        const h = Math.round(img.naturalHeight * k);

        graveCanvas = document.createElement('canvas');
        graveCanvas.width = w;
        graveCanvas.height = h;
        graveCanvas.getContext('2d').drawImage(img, 0, 0, w, h);

        canvas.width = w;
        canvas.height = h;
        container.style.aspectRatio = `${w} / ${h}`;

        candleCut = null;
        resultCanvas = null;
        editControls.style.display = 'none';
        render();

        candleButtons.style.display = 'flex';
        statusEl.innerText = "Nagrobek wczytany! Teraz dodaj zdjęcie znicza.";
      } catch (err) {
        statusEl.innerText = "Błąd: " + err.message;
      }
    });

    // ---------- 2. Znicz: wycinanie tła modelem ML w przeglądarce ----------
    let removeBackgroundFn = null;

    async function getRemover() {
      if (!removeBackgroundFn) {
        const mod = await import(BGREMOVAL_URL);
        removeBackgroundFn = mod.removeBackground;
      }
      return removeBackgroundFn;
    }

    function canvasToBlob(c) {
      return new Promise((resolve) => c.toBlob(resolve, 'image/png'));
    }

    function cropToAlpha(src) {
      const c = src.getContext('2d');
      const { width, height } = src;
      const d = c.getImageData(0, 0, width, height).data;
      let minX = width, minY = height, maxX = -1, maxY = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (d[(y * width + x) * 4 + 3] > 24) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) throw new Error("Nie wykryto znicza na zdjęciu");
      const out = document.createElement('canvas');
      out.width = maxX - minX + 1;
      out.height = maxY - minY + 1;
      out.getContext('2d').drawImage(src, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
      return out;
    }

    async function handleCandleFile(e) {
      const file = e.target.files[0];
      if (!file || !graveCanvas) return;

      try {
        statusEl.innerText = "⏳ Ładowanie modelu wycinania (pierwszy raz ok. 40 MB)...";
        const removeBackground = await getRemover();

        // Zmniejszenie zdjęcia dla szybkości
        const img = await loadImage(file);
        const k = Math.min(1, MAX_CANDLE / Math.max(img.naturalWidth, img.naturalHeight));
        const pre = document.createElement('canvas');
        pre.width = Math.round(img.naturalWidth * k);
        pre.height = Math.round(img.naturalHeight * k);
        pre.getContext('2d').drawImage(img, 0, 0, pre.width, pre.height);
        const inBlob = await canvasToBlob(pre);

        statusEl.innerText = "⏳ Wycinanie tła...";
        const outBlob = await removeBackground(inBlob, {
          output: { format: 'image/png' },
          progress: (key, current, total) => {
            if (total) statusEl.innerText = `⏳ Wycinanie tła... ${Math.round(current / total * 100)}%`;
          }
        });

        const cutImg = await loadImage(outBlob);
        const full = document.createElement('canvas');
        full.width = cutImg.naturalWidth;
        full.height = cutImg.naturalHeight;
        full.getContext('2d').drawImage(cutImg, 0, 0);
        candleCut = cropToAlpha(full);
        harmonizeCandle(candleCut);

        // Rozmiar startowy: znicz ok. 25% wysokości zdjęcia
        const base = (canvas.height * 0.25) / candleCut.height;
        state.scale = base;
        scaleSlider.min = base * 0.3;
        scaleSlider.max = base * 3;
        scaleSlider.step = base / 50;
        scaleSlider.value = base;
        state.x = canvas.width / 2;
        state.y = canvas.height * 0.65;

        resultCanvas = null;
        showEditMode();
        render();
        statusEl.innerText = "Przesuń znicz palcem na płytę, ustaw rozmiar i kliknij przycisk AI.";
      } catch (err) {
        console.error(err);
        statusEl.innerText = "Błąd wycinania: " + err.message;
      }
    }
    inputCandle.addEventListener('change', handleCandleFile);
    inputCandleCamera.addEventListener('change', handleCandleFile);

    // Delikatne dopasowanie balansu bieli znicza do zdjęcia nagrobka (bez zmiany wyglądu)
    function harmonizeCandle(c) {
      const sc = document.createElement('canvas');
      sc.width = sc.height = 32;
      const sctx = sc.getContext('2d');
      sctx.drawImage(graveCanvas, 0, 0, 32, 32);
      const sd = sctx.getImageData(0, 0, 32, 32).data;
      let sr = 0, sg = 0, sb = 0;
      for (let i = 0; i < sd.length; i += 4) { sr += sd[i]; sg += sd[i + 1]; sb += sd[i + 2]; }
      const n = sd.length / 4;
      sr /= n; sg /= n; sb /= n;
      const sL = (sr + sg + sb) / 3 || 1;

      const cc = c.getContext('2d');
      const id = cc.getImageData(0, 0, c.width, c.height);
      const d = id.data;
      let r = 0, g = 0, b = 0, cnt = 0;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] > 200) { r += d[i]; g += d[i + 1]; b += d[i + 2]; cnt++; }
      }
      if (!cnt) return;
      r /= cnt; g /= cnt; b /= cnt;
      const L = (r + g + b) / 3 || 1;

      const mix = 0.3;
      const gain = (sc_, c_) => Math.min(1.1, Math.max(0.9, 1 + ((sc_ / sL) / (c_ / L) - 1) * mix));
      const gr = gain(sr, r), gg = gain(sg, g), gb = gain(sb, b);
      for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] * gr);
        d[i + 1] = Math.min(255, d[i + 1] * gg);
        d[i + 2] = Math.min(255, d[i + 2] * gb);
      }
      cc.putImageData(id, 0, 0);
    }

    function showEditMode() {
      editControls.style.display = 'flex';
      slidersBox.style.display = 'flex';
      inpaintBtn.style.display = 'block';
      undoBtn.style.display = 'none';
    }

    function showResultMode() {
      slidersBox.style.display = 'none';
      inpaintBtn.style.display = 'none';
      undoBtn.style.display = 'block';
    }

    // ---------- Rysowanie: realistyczne wklejenie (bez AI) ----------
    function candleRect() {
      const w = candleCut.width * state.scale;
      const h = candleCut.height * state.scale;
      return { w, h, x0: state.x - w / 2, y0: state.y - h / 2 };
    }

    function drawCandlePlain(c) {
      const { w, h, x0, y0 } = candleRect();
      c.drawImage(candleCut, x0, y0, w, h);
    }

    function drawComposite(c) {
      c.drawImage(graveCanvas, 0, 0);
      if (!candleCut) return;
      const { w, h, x0, y0 } = candleRect();

      // Odbicie w polerowanej płycie
      if (state.reflect > 0) {
        const rh = Math.max(2, Math.round(h * 0.5));
        const refl = document.createElement('canvas');
        refl.width = Math.max(2, Math.round(w));
        refl.height = rh;
        const rc = refl.getContext('2d');
        rc.translate(0, h);
        rc.scale(1, -1);
        rc.drawImage(candleCut, 0, 0, w, h);
        rc.setTransform(1, 0, 0, 1, 0, 0);
        rc.globalCompositeOperation = 'destination-in';
        const g = rc.createLinearGradient(0, 0, 0, rh);
        g.addColorStop(0, `rgba(0,0,0,${state.reflect})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        rc.fillStyle = g;
        rc.fillRect(0, 0, refl.width, rh);
        c.drawImage(refl, x0, y0 + h);
      }

      // Cień kontaktowy pod podstawą
      c.save();
      c.translate(state.x, y0 + h);
      c.scale(1, 0.22);
      const rw = w * 0.8;
      const rg = c.createRadialGradient(0, 0, 0, 0, 0, rw);
      rg.addColorStop(0, 'rgba(0,0,0,0.7)');
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = rg;
      c.fillRect(-rw, -rw, rw * 2, rw * 2);
      c.restore();

      // Znicz z miękkim cieniem
      c.save();
      c.shadowColor = 'rgba(0,0,0,0.45)';
      c.shadowBlur = w * 0.06;
      c.shadowOffsetX = w * 0.04;
      c.shadowOffsetY = h * 0.01;
      c.drawImage(candleCut, x0, y0, w, h);
      c.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (resultCanvas) {
        ctx.drawImage(resultCanvas, 0, 0);
      } else if (graveCanvas) {
        drawComposite(ctx);
      }
    }

    // ---------- 3. AI: tylko cień i odbicie pod zniczem ----------
    function buildMask() {
      const cw = canvas.width, ch = canvas.height;
      const { w, h, x0, y0 } = candleRect();

      const m = document.createElement('canvas');
      m.width = cw;
      m.height = ch;
      const mc = m.getContext('2d');
      mc.fillStyle = '#000';
      mc.fillRect(0, 0, cw, ch);

      // Strefa do przemalowania: dolna część znicza i płyta pod nim
      const pad = w * 0.4;
      mc.fillStyle = '#fff';
      mc.fillRect(x0 - pad, y0 + h * 0.6, w + pad * 2, h * 0.4 + h * 0.5);

      // Sylwetka znicza (poszerzona) pozostaje czarna = nienaruszona
      const sil = document.createElement('canvas');
      sil.width = Math.ceil(w);
      sil.height = Math.ceil(h);
      const sc = sil.getContext('2d');
      sc.drawImage(candleCut, 0, 0, sil.width, sil.height);
      sc.globalCompositeOperation = 'source-in';
      sc.fillStyle = '#000';
      sc.fillRect(0, 0, sil.width, sil.height);

      const r = Math.max(3, w * 0.02);
      mc.drawImage(sil, x0, y0);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        mc.drawImage(sil, x0 + Math.cos(a) * r, y0 + Math.sin(a) * r);
        mc.drawImage(sil, x0 + Math.cos(a) * r * 0.5, y0 + Math.sin(a) * r * 0.5);
      }
      return m;
    }

    async function callAI(srcCanvas, maskFull, W, H, prompt, negative, strength) {
      const aiCanvas = document.createElement('canvas');
      aiCanvas.width = W;
      aiCanvas.height = H;
      aiCanvas.getContext('2d').drawImage(srcCanvas, 0, 0, W, H);

      const maskSmall = document.createElement('canvas');
      maskSmall.width = W;
      maskSmall.height = H;
      maskSmall.getContext('2d').drawImage(maskFull, 0, 0, W, H);

      const res = await fetch(AI_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          negative_prompt: negative,
          image: aiCanvas.toDataURL('image/png').split(',')[1],
          mask: maskSmall.toDataURL('image/png').split(',')[1],
          width: W,
          height: H,
          strength
        })
      });

      const contentType = res.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        const json = await res.json();
        throw new Error(json.error || 'Nieznany błąd workera');
      }
      if (!res.ok) throw new Error(`Błąd HTTP ${res.status}`);

      const img = await loadImage(await res.blob());
      return { img, maskSmall };
    }

    // Warstwa AI w pełnej rozdzielczości, widoczna tylko w obszarze maski (razy opacity)
    function makeLayer(resultImg, maskSmall, opacity) {
      const cw = canvas.width, ch = canvas.height;
      const layer = document.createElement('canvas');
      layer.width = cw;
      layer.height = ch;
      const lc = layer.getContext('2d');
      lc.drawImage(resultImg, 0, 0, cw, ch);
      const ld = lc.getImageData(0, 0, cw, ch);

      const up = document.createElement('canvas');
      up.width = cw;
      up.height = ch;
      const uc = up.getContext('2d');
      uc.drawImage(maskSmall, 0, 0, cw, ch);
      const md = uc.getImageData(0, 0, cw, ch).data;
      for (let i = 0; i < ld.data.length; i += 4) {
        ld.data[i + 3] = md[i] * opacity;
      }
      lc.putImageData(ld, 0, 0);
      return layer;
    }

    // Maska etapu 2: sylwetka znicza (lekko poszerzona) = obszar wtapiania
    function buildCandleMask() {
      const cw = canvas.width, ch = canvas.height;
      const { w, h, x0, y0 } = candleRect();

      const m = document.createElement('canvas');
      m.width = cw;
      m.height = ch;
      const mc = m.getContext('2d');
      mc.fillStyle = '#000';
      mc.fillRect(0, 0, cw, ch);

      const sil = document.createElement('canvas');
      sil.width = Math.ceil(w);
      sil.height = Math.ceil(h);
      const sc = sil.getContext('2d');
      sc.drawImage(candleCut, 0, 0, sil.width, sil.height);
      sc.globalCompositeOperation = 'source-in';
      sc.fillStyle = '#fff';
      sc.fillRect(0, 0, sil.width, sil.height);

      const r = Math.max(4, w * 0.03);
      mc.drawImage(sil, x0, y0);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        mc.drawImage(sil, x0 + Math.cos(a) * r, y0 + Math.sin(a) * r);
        mc.drawImage(sil, x0 + Math.cos(a) * r * 0.5, y0 + Math.sin(a) * r * 0.5);
      }
      return m;
    }

    inpaintBtn.addEventListener('click', async () => {
      if (!candleCut) return;
      inpaintBtn.disabled = true;

      try {
        const cw = canvas.width, ch = canvas.height;
        const k = 512 / Math.max(cw, ch);
        const W = Math.max(256, Math.round(cw * k / 8) * 8);
        const H = Math.max(256, Math.round(ch * k / 8) * 8);
        const realism = parseFloat(realismSlider.value);

        // Etap 1: cień i odbicie pod zniczem (znicz nietknięty)
        statusEl.innerText = realism > 0
          ? "⏳ AI (1/2): cień i odbicie w płycie..."
          : "⏳ AI: cień i odbicie w płycie...";
        const r1 = await callAI(
          canvas, buildMask(), W, H,
          "soft natural shadow and glossy reflection on polished black granite slab, empty stone surface, photorealistic, outdoor daylight",
          "candle, lantern, glass, flame, object, text, watermark, blurry, deformed",
          parseFloat(strengthSlider.value)
        );
        const layer1 = makeLayer(r1.img, r1.maskSmall, 1);

        const stage1 = document.createElement('canvas');
        stage1.width = cw;
        stage1.height = ch;
        const s1 = stage1.getContext('2d');
        drawComposite(s1);
        s1.drawImage(layer1, 0, 0);
        drawCandlePlain(s1);

        let final = stage1;

        // Etap 2: delikatne wtopienie znicza w oświetlenie sceny (mieszane z oryginałem)
        if (realism > 0) {
          statusEl.innerText = "⏳ AI (2/2): wtapianie znicza w scenę...";
          const r2 = await callAI(
            stage1, buildCandleMask(), W, H,
            "realistic glass grave candle lantern on a black granite tombstone in a cemetery, natural outdoor daylight, consistent lighting, photorealistic, same object",
            "different object, deformed, extra objects, text, watermark, blurry",
            0.35
          );
          const layer2 = makeLayer(r2.img, r2.maskSmall, realism);

          final = document.createElement('canvas');
          final.width = cw;
          final.height = ch;
          const fc = final.getContext('2d');
          fc.drawImage(stage1, 0, 0);
          fc.drawImage(layer2, 0, 0);
        }

        resultCanvas = final;
        render();
        showResultMode();
        statusEl.innerText = "✨ Gotowe! Możesz pobrać zdjęcie albo cofnąć AI i zmienić ustawienia.";
      } catch (err) {
        console.error("Błąd AI:", err);
        statusEl.innerText = "Błąd AI: " + err.message;
      }
      inpaintBtn.disabled = false;
    });

    undoBtn.addEventListener('click', () => {
      resultCanvas = null;
      showEditMode();
      render();
      statusEl.innerText = "Cofnięto. Możesz poprawić ustawienie znicza.";
    });

    scaleSlider.addEventListener('input', (e) => {
      state.scale = parseFloat(e.target.value);
      render();
    });

    reflectSlider.addEventListener('input', (e) => {
      state.reflect = parseFloat(e.target.value);
      render();
    });

    // ---------- Przesuwanie ----------
    function getCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function canDrag() { return candleCut && !resultCanvas; }

    canvas.addEventListener('touchstart', (e) => {
      if (!canDrag()) return;
      const pos = getCoords(e.touches[0].clientX, e.touches[0].clientY);
      state.isDragging = true;
      state.x = pos.x;
      state.y = pos.y;
      render();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!state.isDragging) return;
      e.preventDefault();
      const pos = getCoords(e.touches[0].clientX, e.touches[0].clientY);
      state.x = pos.x;
      state.y = pos.y;
      render();
    }, { passive: false });

    canvas.addEventListener('touchend', () => { state.isDragging = false; });

    canvas.addEventListener('mousedown', (e) => {
      if (!canDrag()) return;
      const pos = getCoords(e.clientX, e.clientY);
      state.isDragging = true;
      state.x = pos.x;
      state.y = pos.y;
      render();
    });

    window.addEventListener('mousemove', (e) => {
      if (!state.isDragging) return;
      const pos = getCoords(e.clientX, e.clientY);
      state.x = pos.x;
      state.y = pos.y;
      render();
    });

    window.addEventListener('mouseup', () => { state.isDragging = false; });

    // ---------- Pobieranie ----------
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'wizualizacja-nagrobek.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });
  </script>
</body>
</html>
