<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Przymierz Znicz</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { font-size: 1.3rem; margin-bottom: 12px; font-weight: 700; text-align: center; }

    .step-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .btn:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
    .btn-ai { background: #7c3aed; }
    .btn-download { background: #16a34a; }
    
    input[type="file"] { display: none; }

    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 12px;
      min-height: 22px;
      text-align: center;
    }

    #canvas-container {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 3 / 4;
      background: #1f2937;
      border: 2px dashed #374151;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .controls {
      width: 100%;
      max-width: 440px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .slider-row input { width: 60%; accent-color: #2563eb; }
  </style>
</head>
<body>

  <h1>Wizualizator Znicza</h1>

  <div class="step-container">
    <label class="btn" for="input-grave" id="btn-grave-label">
      📸 1. Dodaj zdjęcie nagrobka
    </label>
    <input type="file" id="input-grave" accept="image/*">

    <label class="btn" for="input-candle" id="btn-candle-label" style="display: none; background: #0284c7;">
      🕯️ 2. Wybierz lub zrób zdjęcie znicza
    </label>
    <input type="file" id="input-candle" accept="image/*" capture="environment">
  </div>

  <div id="status">Wgraj zdjęcie nagrobka, aby rozpocząć.</div>

  <div id="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <div class="controls" id="edit-controls" style="display: none;">
    <div class="slider-row">
      <label for="scale-slider">Wielkość znicza:</label>
      <input type="range" id="scale-slider" min="0.1" max="1.5" step="0.05" value="0.45">
    </div>

    <div class="slider-row">
      <label for="threshold-slider">Wycięcie tła:</label>
      <input type="range" id="threshold-slider" min="150" max="250" step="1" value="215">
    </div>

    <button class="btn btn-ai" id="inpaint-btn">✨ Generuj realistyczną wizualizację (AI)</button>
    <button class="btn btn-download" id="download-btn">💾 Pobierz zdjęcie</button>
  </div>

  <script>
    const WORKER_URL = "https://znicz-ai-proxy.maxfunnn.workers.dev";

    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const inputGrave = document.getElementById('input-grave');
    const inputCandle = document.getElementById('input-candle');
    const btnCandleLabel = document.getElementById('btn-candle-label');
    const editControls = document.getElementById('edit-controls');
    const inpaintBtn = document.getElementById('inpaint-btn');
    const downloadBtn = document.getElementById('download-btn');
    const scaleSlider = document.getElementById('scale-slider');
    const thresholdSlider = document.getElementById('threshold-slider');

    let graveImg = null;
    let candleRawImg = null;
    let candleCutCanvas = null;

    let candleState = {
      x: 0,
      y: 0,
      scale: 0.45,
      threshold: 215,
      isDragging: false
    };

    // 1. Zdjęcie nagrobka
    inputGrave.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      graveImg = new Image();
      graveImg.onload = () => {
        canvas.width = graveImg.naturalWidth;
        canvas.height = graveImg.naturalHeight;
        render();

        btnCandleLabel.style.display = 'block';
        statusEl.innerText = "Nagrobek wczytany! Teraz dodaj lub zrób zdjęcie znicza.";
      };
      graveImg.src = url;
    });

    // 2. Zdjęcie znicza
    inputCandle.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.innerText = "Przetwarzanie znicza...";
      const url = URL.createObjectURL(file);

      candleRawImg = new Image();
      candleRawImg.onload = () => {
        candleState.x = canvas.width / 2;
        candleState.y = canvas.height * 0.65;
        processCandleCut();

        editControls.style.display = 'flex';
        statusEl.innerText = "Przesuń znicz palcem na płytę nagrobka.";
      };
      candleRawImg.src = url;
    });

    function processCandleCut() {
      if (!candleRawImg) return;
      candleCutCanvas = document.createElement('canvas');
      candleCutCanvas.width = candleRawImg.naturalWidth;
      candleCutCanvas.height = candleRawImg.naturalHeight;

      const cCtx = candleCutCanvas.getContext('2d');
      cCtx.drawImage(candleRawImg, 0, 0);

      const imgData = cCtx.getImageData(0, 0, candleCutCanvas.width, candleCutCanvas.height);
      const data = imgData.data;
      const th = candleState.threshold;

      for (let i = 0; i < data.length; i += 4) {
        if (data[i] >= th && data[i + 1] >= th && data[i + 2] >= th) {
          data[i + 3] = 0;
        }
      }

      cCtx.putImageData(imgData, 0, 0);
      render();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (graveImg) {
        ctx.drawImage(graveImg, 0, 0, canvas.width, canvas.height);
      }

      if (candleCutCanvas) {
        const w = candleCutCanvas.width * candleState.scale;
        const h = candleCutCanvas.height * candleState.scale;
        const drawX = candleState.x - w / 2;
        const drawY = candleState.y - h / 2;

        ctx.drawImage(candleCutCanvas, drawX, drawY, w, h);
      }
    }

    // 3. Wtapianie AI (Cloudflare Workers AI)
    inpaintBtn.addEventListener('click', async () => {
      if (!candleCutCanvas) return;

      statusEl.innerText = "⏳ Generowanie realistycznego cienia i światła przez AI...";
      inpaintBtn.disabled = true;

      try {
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = canvas.width;
        maskCanvas.height = canvas.height;
        const mCtx = maskCanvas.getContext('2d');
        mCtx.fillStyle = '#000000';
        mCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);

        const w = candleCutCanvas.width * candleState.scale;
        const h = candleCutCanvas.height * candleState.scale;
        const drawX = candleState.x - w / 2;
        const drawY = candleState.y - h / 2;

        mCtx.fillStyle = '#ffffff';
        mCtx.fillRect(drawX, drawY, w, h);

        const [origBlob, maskBlob] = await Promise.all([
          new Promise(r => canvas.toBlob(r, 'image/png')),
          new Promise(r => maskCanvas.toBlob(r, 'image/png'))
        ]);

        const formData = new FormData();
        formData.append('image', origBlob);
        formData.append('mask', maskBlob);

        const res = await fetch(`${WORKER_URL}?action=inpaint`, {
          method: 'POST',
          body: formData
        });

        if (!res.ok) throw new Error("Błąd serwera AI: " + res.statusText);

        const resultBlob = await res.blob();
        const resultImg = new Image();
        resultImg.onload = () => {
          graveImg = resultImg;
          candleCutCanvas = null;
          render();
          statusEl.innerText = "Wizualizacja gotowa! Możesz pobrać zdjęcie.";
          inpaintBtn.disabled = false;
        };
        resultImg.src = URL.createObjectURL(resultBlob);

      } catch (err) {
        console.error(err);
        statusEl.innerText = "Błąd generowania AI. Spróbuj ponownie.";
        inpaintBtn.disabled = false;
      }
    });

    scaleSlider.addEventListener('input', (e) => {
      candleState.scale = parseFloat(e.target.value);
      render();
    });

    thresholdSlider.addEventListener('input', (e) => {
      candleState.threshold = parseInt(e.target.value, 10);
      processCandleCut();
    });

    function getCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('touchstart', (e) => {
      if (!candleCutCanvas) return;
      const pos = getCoords(e.touches[0].clientX, e.touches[0].clientY);
      candleState.isDragging = true;
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!candleState.isDragging) return;
      e.preventDefault();
      const pos = getCoords(e.touches[0].clientX, e.touches[0].clientY);
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    }, { passive: false });

    canvas.addEventListener('touchend', () => { candleState.isDragging = false; });

    canvas.addEventListener('mousedown', (e) => {
      if (!candleCutCanvas) return;
      const pos = getCoords(e.clientX, e.clientY);
      candleState.isDragging = true;
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    });

    window.addEventListener('mousemove', (e) => {
      if (!candleState.isDragging) return;
      const pos = getCoords(e.clientX, e.clientY);
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    });

    window.addEventListener('mouseup', () => { candleState.isDragging = false; });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'nagrobek-wizualizacja.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });
  </script>
</body>
</html>
