<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wizualizator Znicza</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 12px; font-weight: 700; text-align: center; }

    .step-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn-candle { background: #0284c7; }
    .btn-ai { background: #9333ea; }
    .btn-download { background: #16a34a; }

    input[type="file"] { display: none; }

    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 12px;
      min-height: 22px;
      text-align: center;
      word-break: break-word;
      padding: 0 8px;
    }

    #canvas-container {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 3 / 4;
      background: #1e293b;
      border: 2px dashed #334155;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; object-fit: contain; }

    .controls {
      width: 100%;
      max-width: 440px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .slider-row input { width: 55%; accent-color: #4f46e5; }
  </style>
</head>
<body>

  <h1>Wizualizator Znicza</h1>

  <div class="step-container">
    <label class="btn" for="input-grave" id="btn-grave-label">
      📸 1. Dodaj zdjęcie nagrobka
    </label>
    <input type="file" id="input-grave" accept="image/*">

    <label class="btn btn-candle" for="input-candle" id="btn-candle-label" style="display: none;">
      🕯️ 2. Wybierz lub zrób zdjęcie znicza
    </label>
    <input type="file" id="input-candle" accept="image/*" capture="environment">
  </div>

  <div id="status">Wgraj zdjęcie nagrobka, aby rozpocząć.</div>

  <div id="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <div class="controls" id="edit-controls" style="display: none;">
    <div class="slider-row">
      <label for="scale-slider">Wielkość znicza:</label>
      <input type="range" id="scale-slider" min="0.1" max="1.5" step="0.05" value="0.45">
    </div>

    <div class="slider-row">
      <label for="threshold-slider">Wycięcie tła:</label>
      <input type="range" id="threshold-slider" min="140" max="250" step="1" value="215">
    </div>

    <div class="slider-row">
      <label for="strength-slider">Siła AI:</label>
      <input type="range" id="strength-slider" min="0.3" max="0.9" step="0.05" value="0.6">
    </div>

    <button class="btn btn-ai" id="inpaint-btn">✨ Wtop znicz przez AI</button>
    <button class="btn btn-download" id="download-btn">💾 Pobierz zdjęcie</button>
  </div>

  <script>
    // Worker Cloudflare (Workers AI). Żadnego tokena we froncie.
    const AI_URL = "https://znicz-ai-proxy.maxfunnn.workers.dev";

    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const inputGrave = document.getElementById('input-grave');
    const inputCandle = document.getElementById('input-candle');
    const btnCandleLabel = document.getElementById('btn-candle-label');
    const editControls = document.getElementById('edit-controls');
    const inpaintBtn = document.getElementById('inpaint-btn');
    const downloadBtn = document.getElementById('download-btn');

    const scaleSlider = document.getElementById('scale-slider');
    const thresholdSlider = document.getElementById('threshold-slider');
    const strengthSlider = document.getElementById('strength-slider');

    let graveImg = null;
    let candleRawImg = null;
    let candleCutCanvas = null;

    let candleState = {
      x: 0,
      y: 0,
      scale: 0.45,
      threshold: 215,
      isDragging: false
    };

    // 1. Ładowanie nagrobka
    inputGrave.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      graveImg = new Image();
      graveImg.onload = () => {
        canvas.width = graveImg.naturalWidth;
        canvas.height = graveImg.naturalHeight;
        render();

        btnCandleLabel.style.display = 'block';
        statusEl.innerText = "Nagrobek wczytany! Teraz dodaj zdjęcie znicza.";
      };
      graveImg.src = url;
    });

    // 2. Ładowanie znicza
    inputCandle.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusEl.innerText = "Przetwarzanie znicza...";
      const url = URL.createObjectURL(file);

      candleRawImg = new Image();
      candleRawImg.onload = () => {
        candleState.x = canvas.width / 2;
        candleState.y = canvas.height * 0.65;
        processCandleCut();

        editControls.style.display = 'flex';
        statusEl.innerText = "Przesuń znicz palcem na płytę nagrobka i kliknij przycisk AI.";
      };
      candleRawImg.src = url;
    });

    function processCandleCut() {
      if (!candleRawImg) return;
      candleCutCanvas = document.createElement('canvas');
      candleCutCanvas.width = candleRawImg.naturalWidth;
      candleCutCanvas.height = candleRawImg.naturalHeight;

      const cCtx = candleCutCanvas.getContext('2d');
      cCtx.drawImage(candleRawImg, 0, 0);

      const imgData = cCtx.getImageData(0, 0, candleCutCanvas.width, candleCutCanvas.height);
      const data = imgData.data;
      const th = candleState.threshold;

      for (let i = 0; i < data.length; i += 4) {
        if (data[i] >= th && data[i + 1] >= th && data[i + 2] >= th) {
          data[i + 3] = 0;
        }
      }

      cCtx.putImageData(imgData, 0, 0);
      render();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (graveImg) {
        ctx.drawImage(graveImg, 0, 0, canvas.width, canvas.height);
      }

      if (candleCutCanvas) {
        const w = candleCutCanvas.width * candleState.scale;
        const h = candleCutCanvas.height * candleState.scale;
        const drawX = candleState.x - w / 2;
        const drawY = candleState.y - h / 2;

        ctx.drawImage(candleCutCanvas, drawX, drawY, w, h);
      }
    }

    // 3. Inpainting AI przez Cloudflare Workers AI
    inpaintBtn.addEventListener('click', async () => {
      if (!candleCutCanvas) return;

      statusEl.innerText = "⏳ Generowanie wizualizacji AI (ok. 10-30 s)...";
      inpaintBtn.disabled = true;

      try {
        // Proporcje zachowane, max 512 px, wymiary podzielne przez 8
        const scale = 512 / Math.max(canvas.width, canvas.height);
        const W = Math.max(256, Math.round(canvas.width * scale / 8) * 8);
        const H = Math.max(256, Math.round(canvas.height * scale / 8) * 8);

        const aiCanvas = document.createElement('canvas');
        aiCanvas.width = W;
        aiCanvas.height = H;
        aiCanvas.getContext('2d').drawImage(canvas, 0, 0, W, H);

        // Maska: biały = obszar do przemalowania
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = W;
        maskCanvas.height = H;
        const mCtx = maskCanvas.getContext('2d');
        mCtx.fillStyle = '#000000';
        mCtx.fillRect(0, 0, W, H);

        const rx = W / canvas.width;
        const ry = H / canvas.height;
        const w = candleCutCanvas.width * candleState.scale * rx;
        const h = candleCutCanvas.height * candleState.scale * ry;
        const dx = candleState.x * rx - w / 2;
        const dy = candleState.y * ry - h / 2;

        mCtx.fillStyle = '#ffffff';
        mCtx.fillRect(dx - 8, dy - 8, w + 16, h + 24);

        const payload = {
          prompt: "a realistic glass grave candle lantern sitting on a dark polished granite tombstone, cemetery, natural daylight, soft cast shadow and reflection on the stone",
          image: aiCanvas.toDataURL('image/png').split(',')[1],
          mask: maskCanvas.toDataURL('image/png').split(',')[1],
          width: W,
          height: H,
          strength: parseFloat(strengthSlider.value)
        };

        const res = await fetch(AI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          const json = await res.json();
          throw new Error(json.error || 'Nieznany błąd workera');
        }
        if (!res.ok) throw new Error(`Błąd HTTP ${res.status}`);

        const resultBlob = await res.blob();
        const resultImg = new Image();
        resultImg.onload = () => {
          graveImg = resultImg;
          canvas.width = resultImg.naturalWidth;
          canvas.height = resultImg.naturalHeight;
          candleCutCanvas = null;
          editControls.style.display = 'none';
          render();
          statusEl.innerText = "✨ Gotowe! Możesz pobrać zdjęcie.";
          inpaintBtn.disabled = false;
        };
        resultImg.src = URL.createObjectURL(resultBlob);

      } catch (err) {
        console.error("Błąd AI:", err);
        statusEl.innerText = "Błąd AI: " + err.message;
        inpaintBtn.disabled = false;
      }
    });

    scaleSlider.addEventListener('input', (e) => {
      candleState.scale = parseFloat(e.target.value);
      render();
    });

    thresholdSlider.addEventListener('input', (e) => {
      candleState.threshold = parseInt(e.target.value, 10);
      processCandleCut();
    });

    function getCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    // Dotyk (smartfony)
    canvas.addEventListener('touchstart', (e) => {
      if (!candleCutCanvas) return;
      const pos = getCoords(e.touches[0].clientX, e.touches[0].clientY);
      candleState.isDragging = true;
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!candleState.isDragging) return;
      e.preventDefault();
      const pos = getCoords(e.touches[0].clientX, e.touches[0].clientY);
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    }, { passive: false });

    canvas.addEventListener('touchend', () => { candleState.isDragging = false; });

    // Mysz (komputer)
    canvas.addEventListener('mousedown', (e) => {
      if (!candleCutCanvas) return;
      const pos = getCoords(e.clientX, e.clientY);
      candleState.isDragging = true;
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    });

    window.addEventListener('mousemove', (e) => {
      if (!candleState.isDragging) return;
      const pos = getCoords(e.clientX, e.clientY);
      candleState.x = pos.x;
      candleState.y = pos.y;
      render();
    });

    window.addEventListener('mouseup', () => { candleState.isDragging = false; });

    // Pobieranie
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'wizualizacja-nagrobek.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });
  </script>
</body>
</html>
