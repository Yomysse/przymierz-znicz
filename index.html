<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wizualizator Zniczy</title>
  <meta name="theme-color" content="#090d18">

  <style>
    :root {
      --bar-h: 0px;
      --amber: #f5c26b;
      --amber-deep: #d98f2b;
      --line: rgba(245, 194, 107, 0.22);
      --card: rgba(20, 26, 43, 0.82);
      --text: #f5efe3;
      --muted: #b4ab96;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 108%, rgba(217, 143, 43, 0.28), transparent 55%),
        radial-gradient(ellipse at 50% -8%, rgba(86, 98, 150, 0.28), transparent 52%),
        #090d18;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 22px 16px 32px;
    }

    /* Nagłówek */
    .hero { text-align: center; margin-bottom: 6px; }
    .flame-wrap { width: 220px; height: 160px; margin: 0 auto 6px; position: relative; }
    .flame-wrap::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      width: 280px;
      height: 150px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at 50% 70%, rgba(245, 194, 107, 0.34), transparent 66%);
      animation: glow 3.2s ease-in-out infinite;
    }
    .flame-wrap svg { position: relative; width: 100%; height: 100%; overflow: visible; }
    .hero-cross { filter: drop-shadow(0 0 8px rgba(245, 194, 107, 0.35)); }
    .flame { transform-box: fill-box; transform-origin: 50% 90%; animation: flicker 2.6s ease-in-out infinite; }
    .flame.b { animation-delay: -1.3s; }
    @keyframes flicker {
      0%, 100% { transform: scale(1, 1) rotate(0deg); }
      18% { transform: scale(0.96, 1.05) rotate(-1.5deg); }
      37% { transform: scale(1.03, 0.97) rotate(1.2deg); }
      61% { transform: scale(0.98, 1.04) rotate(-0.8deg); }
      82% { transform: scale(1.02, 0.99) rotate(1deg); }
    }
    @keyframes glow {
      0%, 100% { opacity: 0.85; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #fbe9c4;
      text-shadow: 0 0 18px rgba(245, 194, 107, 0.35);
    }
    .ornament { color: var(--amber); opacity: 0.7; letter-spacing: 0.5em; font-size: 0.7rem; margin: 8px 0 10px; }
    .subtitle {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--muted);
      text-align: center;
      margin: 0 auto 18px;
      max-width: 400px;
      line-height: 1.5;
    }

    /* Karty kroków */
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    .card-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      color: #fbe9c4;
      margin-bottom: 12px;
    }
    .btn-row { display: flex; gap: 10px; }

    /* Przyciski */
    .btn {
      width: 100%;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      padding: 16px 12px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s, background 0.2s, box-shadow 0.2s;
      display: block;
    }
    .btn-row .btn { flex: 1; }
    .btn-row .btn.wide { flex: 2; }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-grave, .btn-candle {
      background: linear-gradient(180deg, rgba(245, 194, 107, 0.14), rgba(245, 194, 107, 0.05));
      border-color: rgba(245, 194, 107, 0.4);
    }
    .btn-advisor {
      background: linear-gradient(180deg, rgba(147, 51, 234, 0.28), rgba(126, 34, 206, 0.14));
      border-color: rgba(192, 132, 252, 0.45);
      color: #f3e8ff;
      margin-top: 10px;
      padding: 13px;
      font-size: 0.93rem;
    }
    .btn-ai {
      background: linear-gradient(180deg, #f9dc9a, #e0a23a);
      color: #2b1a06;
      border: none;
      font-weight: 700;
      box-shadow: 0 0 22px rgba(245, 194, 107, 0.4);
    }
    .btn-download {
      background: linear-gradient(180deg, #3d8564, #2c6a4d);
      border: none;
      color: #f2fff8;
    }
    .btn-undo { background: rgba(255, 255, 255, 0.05); color: var(--muted); }

    input[type="file"] { display: none; }

    #status {
      font-size: 0.98rem;
      color: #ddd3bb;
      margin-bottom: 10px;
      min-height: 22px;
      text-align: center;
      word-break: break-word;
      padding: 0 8px;
      max-width: 440px;
      line-height: 1.45;
    }
    #status.error { color: #ffb4a8; }

    /* Moduł doradcy AI - pełna wysokość, bez ucinania treści */
    .advisor-box {
      margin-top: 12px;
      padding: 16px;
      background: rgba(13, 19, 33, 0.94);
      border: 1px solid rgba(192, 132, 252, 0.45);
      border-radius: 14px;
      font-size: 0.94rem;
      line-height: 1.65;
      color: #f1f5f9;
      white-space: pre-line;
      box-shadow: inset 0 0 24px rgba(147, 51, 234, 0.18);
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
    }
    .advisor-header {
      font-family: Georgia, serif;
      color: #f5d0fe;
      font-size: 1.05rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    /* Zdjęcie nagrobka i obszar roboczy */
    #canvas-container {
      --ar: 0.75;
      width: min(100%, 440px, max(200px, calc(var(--ar) * (100vh - var(--bar-h) - 120px))));
      aspect-ratio: 3 / 4;
      background: rgba(20, 26, 43, 0.6);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 44px rgba(217, 143, 43, 0.14), 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    canvas { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }

    .busy {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 24, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 20px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      line-height: 1.5;
      color: #fbe9c4;
    }
    #busy-text { white-space: pre-line; }
    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(245, 194, 107, 0.2);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 18px rgba(245, 194, 107, 0.3);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Dolny pasek */
    #bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(9, 13, 24, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.45);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      display: none;
    }
    .bar-inner { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .chips { display: flex; gap: 8px; align-items: center; justify-content: center; }
    .chip {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 3px;
      font-size: 1.5rem;
      color: var(--amber);
    }
    .chip img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .chip.selected { border-color: var(--amber); background: rgba(245, 194, 107, 0.14); box-shadow: 0 0 14px rgba(245, 194, 107, 0.35); }
    .chip.add { border-style: dashed; border-color: rgba(245, 194, 107, 0.45); }

    .size-row { display: flex; align-items: center; gap: 12px; }
    .size-row input { flex: 1; accent-color: var(--amber); height: 32px; }
    .size-row .small { font-size: 1rem; }
    .size-row .big { font-size: 1.6rem; }
    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(255, 120, 100, 0.35);
      background: rgba(120, 30, 30, 0.45);
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
    }
    #bar .btn { padding: 16px 8px; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 12, 0.78);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 20px;
      display: none;
    }
    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #121828;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 0 40px rgba(217, 143, 43, 0.18);
    }

    @media (prefers-reduced-motion: reduce) {
      .flame, .flame-wrap::before, .spinner { animation: none; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="flame-wrap" aria-hidden="true">
      <svg viewBox="0 0 220 160">
        <defs>
          <radialGradient id="fg" cx="50%" cy="72%" r="65%">
            <stop offset="0%" stop-color="#fff6d6"/>
            <stop offset="45%" stop-color="#ffd36b"/>
            <stop offset="100%" stop-color="#ef8a2a"/>
          </radialGradient>
          <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fbe3a8"/>
            <stop offset="100%" stop-color="#c98a2c"/>
          </linearGradient>
        </defs>

        <line x1="14" y1="146" x2="206" y2="146" stroke="#f5c26b" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>

        <g class="hero-cross">
          <rect x="102" y="6" width="16" height="140" rx="2" fill="url(#cg)"/>
          <rect x="72" y="36" width="76" height="16" rx="2" fill="url(#cg)"/>
        </g>

        <g>
          <rect x="31" y="112" width="18" height="34" rx="3" fill="#efe3c6"/>
          <rect x="39" y="107" width="2" height="7" fill="#3b2f20"/>
          <g transform="translate(40 100)">
            <g class="flame"><path d="M0 -17 C6 -5 12 3 12 11 A12 12 0 0 1 -12 11 C-12 3 -6 -1 -3 -9 C-2 -6 -1 -4 0 -1 C3 -8 1 -12 0 -17 Z" fill="url(#fg)"/></g>
          </g>
        </g>
        <g>
          <rect x="171" y="112" width="18" height="34" rx="3" fill="#efe3c6"/>
          <rect x="179" y="107" width="2" height="7" fill="#3b2f20"/>
          <g transform="translate(180 100)">
            <g class="flame b"><path d="M0 -17 C6 -5 12 3 12 11 A12 12 0 0 1 -12 11 C-12 3 -6 -1 -3 -9 C-2 -6 -1 -4 0 -1 C3 -8 1 -12 0 -17 Z" fill="url(#fg)"/></g>
          </g>
        </g>
      </svg>
    </div>
    <h1>Wizualizator Zniczy</h1>
    <div class="ornament">✦ ✦ ✦</div>
  </div>
  <p class="subtitle">Zobacz, jak wybrane znicze będą wyglądały na grobie bliskich, zanim je zapalisz.</p>

  <div class="card">
    <div class="card-title">Krok 1. Zdjęcie nagrobka</div>
    <div class="btn-row">
      <label class="btn btn-grave" for="input-grave-camera">📷 Zrób zdjęcie</label>
      <label class="btn btn-grave" for="input-grave">🖼️ Z galerii</label>
    </div>
    <input type="file" id="input-grave-camera" accept="image/*" capture="environment">
    <input type="file" id="input-grave" accept="image/*">

    <!-- Przycisk doradcy Gemini AI -->
    <button class="btn btn-advisor" id="advisor-btn" style="display: none;">
      💡 Doradź, jakie znicze pasują (Gemini AI)
    </button>
    <div class="advisor-box" id="advisor-box" style="display: none;"></div>
  </div>

  <div class="card" id="step-candle" style="display: none;">
    <div class="card-title">Krok 2. Zdjęcie znicza</div>
    <div class="btn-row">
      <label class="btn btn-candle" for="input-candle-camera">📷 Zrób zdjęcie</label>
      <label class="btn btn-candle" for="input-candle">🖼️ Z galerii</label>
    </div>
    <input type="file" id="input-candle-camera" accept="image/*" capture="environment">
    <input type="file" id="input-candle" accept="image/*">
  </div>

  <div id="status">Zacznij od dodania zdjęcia nagrobka.</div>

  <div id="canvas-container">
    <canvas id="stage"></canvas>
    <div class="busy" id="busy" style="display: none;">
      <div class="spinner"></div>
      <div id="busy-text"></div>
    </div>
  </div>

  <div id="bar">
    <div class="bar-inner">
      <div class="chips" id="row-chips"></div>

      <div class="size-row" id="row-size">
        <span class="small">🕯️</span>
        <input type="range" id="scale-slider" min="0.05" max="1.5" step="0.01" value="0.3" aria-label="Wielkość znicza">
        <span class="big">🕯️</span>
        <button class="icon-btn" id="delete-btn" aria-label="Usuń wybrany znicz" style="display: none;">🗑️</button>
      </div>

      <div class="btn-row" id="row-edit-btns">
        <button class="btn btn-ai wide" id="inpaint-btn">✨ Pokaż wizualizację</button>
        <button class="btn btn-download" id="download-btn">💾 Zapisz</button>
      </div>

      <div class="btn-row" id="row-result-btns" style="display: none;">
        <button class="btn btn-download wide" id="download-result-btn">💾 Zapisz zdjęcie</button>
        <button class="btn btn-undo" id="undo-btn">↩️ Popraw</button>
      </div>
    </div>
  </div>

  <div class="modal" id="add-modal">
    <div class="modal-box">
      <div class="card-title">Dodaj kolejny znicz</div>
      <div class="btn-row">
        <label class="btn btn-candle" for="input-candle-camera" id="modal-camera">📷 Zrób zdjęcie</label>
        <label class="btn btn-candle" for="input-candle" id="modal-gallery">🖼️ Z galerii</label>
      </div>
      <button class="btn btn-undo" id="modal-cancel">Anuluj</button>
    </div>
  </div>

  <script>
    // ---------- KONFIGURACJA GEMINI AI ----------
    const GEMINI_API_KEY = "AIzaSyBWkjBtSpWLPMzp-JuIbW2XyTbHVb_qbh8";
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`;
    const AI_URL = "https://znicz-ai-proxy.maxfunnn.workers.dev";
    const BGREMOVAL_URL = "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";
    const MAX_GRAVE = 1600;
    const MAX_CANDLE = 1024;
    const MAX_CANDLES = 3;
    const START_X = [0.5, 0.28, 0.72];

    const statusEl = document.getElementById('status');
    const container = document.getElementById('canvas-container');
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const busyEl = document.getElementById('busy');
    const busyText = document.getElementById('busy-text');

    const inputGrave = document.getElementById('input-grave');
    const inputGraveCamera = document.getElementById('input-grave-camera');
    const inputCandle = document.getElementById('input-candle');
    const inputCandleCamera = document.getElementById('input-candle-camera');
    const stepCandle = document.getElementById('step-candle');

    const advisorBtn = document.getElementById('advisor-btn');
    const advisorBox = document.getElementById('advisor-box');

    const bar = document.getElementById('bar');
    const rowChips = document.getElementById('row-chips');
    const rowSize = document.getElementById('row-size');
    const rowEditBtns = document.getElementById('row-edit-btns');
    const rowResultBtns = document.getElementById('row-result-btns');
    const scaleSlider = document.getElementById('scale-slider');
    const deleteBtn = document.getElementById('delete-btn');
    const inpaintBtn = document.getElementById('inpaint-btn');
    const undoBtn = document.getElementById('undo-btn');
    const downloadBtn = document.getElementById('download-btn');
    const downloadResultBtn = document.getElementById('download-result-btn');

    const addModal = document.getElementById('add-modal');

    let graveCanvas = null;
    let candles = [];
    let selected = -1;
    let resultCanvas = null;
    let drag = { active: false, dx: 0, dy: 0 };

    function setStatus(msg, isError = false) {
      statusEl.innerText = msg;
      statusEl.classList.toggle('error', isError);
    }
    function setBusy(msg) {
      busyText.innerText = msg;
      busyEl.style.display = 'flex';
    }
    function clearBusy() { busyEl.style.display = 'none'; }

    function fitBar() {
      if (bar.style.display === 'none' || !bar.style.display) return;
      const h = bar.offsetHeight;
      document.documentElement.style.setProperty('--bar-h', h + 'px');
      document.body.style.paddingBottom = (h + 16) + 'px';
    }
    function hideBar() {
      bar.style.display = 'none';
      document.documentElement.style.setProperty('--bar-h', '0px');
      document.body.style.paddingBottom = '32px';
    }
    function focusStage() {
      setTimeout(() => statusEl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("load"));
        img.src = url;
      });
    }

    // ---------- 1. Nagrobek ----------
    async function handleGraveFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const img = await loadImage(file);
        const k = Math.min(1, MAX_GRAVE / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * k);
        const h = Math.round(img.naturalHeight * k);

        graveCanvas = document.createElement('canvas');
        graveCanvas.width = w;
        graveCanvas.height = h;
        graveCanvas.getContext('2d').drawImage(img, 0, 0, w, h);

        canvas.width = w;
        canvas.height = h;
        container.style.aspectRatio = `${w} / ${h}`;
        container.style.setProperty('--ar', (w / h).toString());

        candles = [];
        selected = -1;
        resultCanvas = null;
        hideBar();
        render();

        stepCandle.style.display = 'block';
        advisorBtn.style.display = 'block';
        advisorBox.style.display = 'none';
        setStatus("Świetnie! Możesz zapytać doradcę AI o rekomendację lub dodać znicz.");
      } catch (err) {
        setStatus("Nie udało się wczytać zdjęcia. Spróbuj wybrać inne.", true);
      }
      e.target.value = '';
    }
    inputGrave.addEventListener('change', handleGraveFile);
    inputGraveCamera.addEventListener('change', handleGraveFile);

  // ---------- REKOMENDACJE GEMINI AI ----------
    advisorBtn.addEventListener('click', async () => {
      if (!graveCanvas) return;

      advisorBtn.disabled = true;
      advisorBtn.innerText = "⏳ Analizuję pomnik przez AI...";
      advisorBox.style.display = 'block';
      advisorBox.innerHTML = '<div class="advisor-header">✨ Doradca Kompozycji:</div>Analizuję nagrobek...';

      try {
        const thumb = document.createElement('canvas');
        const k = 600 / Math.max(graveCanvas.width, graveCanvas.height);
        thumb.width = Math.round(graveCanvas.width * k);
        thumb.height = Math.round(graveCanvas.height * k);
        thumb.getContext('2d').drawImage(graveCanvas, 0, 0, thumb.width, thumb.height);
        const base64Data = thumb.toDataURL('image/jpeg', 0.8).split(',')[1];

        const promptText = 
          "Działasz jako doradca i florysta funeralny. Przeanalizuj zdjęcie nagrobka (odcień i fakturę granitu, styl pomnika, przestrzeń na płycie) i w zwięzłych, czytelnych punktach doradź:\n" +
          "1. Jaki styl zniczy najlepiej pasuje (np. nowoczesne geometryczne, klasyczne kapliczki, mrożone szkło)?\n" +
          "2. Jaka kolorystyka szkła i okuć będzie najbardziej harmonijna (np. złoto, czerń, miedź, srebro)?\n" +
          "3. Jak najlepiej je rozmieścić (proporcje, pojedynczy znicz czy symetryczny układ po bokach)?\n" +
          "Napisz zwięźle, taktownie i w czytelnych punktach.";

        const payload = {
          contents: [{
            parts: [
              { text: promptText },
              { inlineData: { mimeType: "image/jpeg", data: base64Data } }
            ]
          }],
          generationConfig: {
            temperature: 0.4,
            maxOutputTokens: 1024
          }
        };

        // Próba z gemini-2.0-flash
        let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // Jeśli model nie jest dostępny, fallback na gemini-2.5-flash
        if (!res.ok) {
          res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data?.error?.message || `Status HTTP ${res.status}`);
        }

        const recommendation = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (recommendation) {
          advisorBox.innerHTML = `<div class="advisor-header">✨ Rekomendacja AI:</div>\n` + recommendation;
          advisorBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          advisorBox.innerText = "Nie udało się wygenerować rekomendacji.";
        }
      } catch (err) {
        console.error("Szczegóły błędu:", err);
        advisorBox.innerText = "Błąd API Gemini: " + err.message;
      } finally {
        advisorBtn.disabled = false;
        advisorBtn.innerText = "💡 Wygeneruj rekomendację ponownie";
      }
    });

    // ---------- 2. Znicz: wycinanie tła ----------
    let removeBackgroundFn = null;

    async function getRemover() {
      if (!removeBackgroundFn) {
        const mod = await import(BGREMOVAL_URL);
        removeBackgroundFn = mod.removeBackground;
      }
      return removeBackgroundFn;
    }

    function canvasToBlob(c) {
      return new Promise((resolve) => c.toBlob(resolve, 'image/png'));
    }

    function cropToAlpha(src) {
      const c = src.getContext('2d');
      const { width, height } = src;
      const d = c.getImageData(0, 0, width, height).data;
      let minX = width, minY = height, maxX = -1, maxY = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (d[(y * width + x) * 4 + 3] > 24) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) throw new Error("empty");
      const out = document.createElement('canvas');
      out.width = maxX - minX + 1;
      out.height = maxY - minY + 1;
      out.getContext('2d').drawImage(src, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
      return out;
    }

    function harmonizeCandle(c) {
      const sc = document.createElement('canvas');
      sc.width = sc.height = 32;
      const sctx = sc.getContext('2d');
      sctx.drawImage(graveCanvas, 0, 0, 32, 32);
      const sd = sctx.getImageData(0, 0, 32, 32).data;
      let sr = 0, sg = 0, sb = 0;
      for (let i = 0; i < sd.length; i += 4) { sr += sd[i]; sg += sd[i + 1]; sb += sd[i + 2]; }
      const n = sd.length / 4;
      sr /= n; sg /= n; sb /= n;
      const sL = (sr + sg + sb) / 3 || 1;

      const cc = c.getContext('2d');
      const id = cc.getImageData(0, 0, c.width, c.height);
      const d = id.data;
      let r = 0, g = 0, b = 0, cnt = 0;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] > 200) { r += d[i]; g += d[i + 1]; b += d[i + 2]; cnt++; }
      }
      if (!cnt) return;
      r /= cnt; g /= cnt; b /= cnt;
      const L = (r + g + b) / 3 || 1;

      const mix = 0.3;
      const gain = (s_, c_) => Math.min(1.1, Math.max(0.9, 1 + ((s_ / sL) / (c_ / L) - 1) * mix));
      const gr = gain(sr, r), gg = gain(sg, g), gb = gain(sb, b);
      for (let i = 0; i < d.length; i += 4) {
        d[i] = Math.min(255, d[i] * gr);
        d[i + 1] = Math.min(255, d[i + 1] * gg);
        d[i + 2] = Math.min(255, d[i + 2] * gb);
      }
      cc.putImageData(id, 0, 0);
    }

    function makeThumb(cut) {
      const t = document.createElement('canvas');
      t.height = 64;
      t.width = Math.max(24, Math.round(cut.width * 64 / cut.height));
      t.getContext('2d').drawImage(cut, 0, 0, t.width, t.height);
      return t.toDataURL('image/png');
    }

    async function handleCandleFile(e) {
      const file = e.target.files[0];
      if (!file || !graveCanvas) return;
      if (candles.length >= MAX_CANDLES) {
        setStatus(`Możesz dodać maksymalnie ${MAX_CANDLES} znicze.`, true);
        e.target.value = '';
        return;
      }

      let removeBackground;
      try {
        setBusy("Przygotowuję wycinanie znicza…");
        removeBackground = await getRemover();
      } catch (err) {
        console.error(err);
        clearBusy();
        setStatus("Nie udało się uruchomić wycinania. Sprawdź połączenie z internetem i spróbuj ponownie.", true);
        e.target.value = '';
        return;
      }

      try {
        const img = await loadImage(file);
        const k = Math.min(1, MAX_CANDLE / Math.max(img.naturalWidth, img.naturalHeight));
        const pre = document.createElement('canvas');
        pre.width = Math.round(img.naturalWidth * k);
        pre.height = Math.round(img.naturalHeight * k);
        pre.getContext('2d').drawImage(img, 0, 0, pre.width, pre.height);
        const inBlob = await canvasToBlob(pre);

        setBusy("Wycinam znicz ze zdjęcia… To potrwa chwilę.");
        const outBlob = await removeBackground(inBlob, { output: { format: 'image/png' } });

        const cutImg = await loadImage(outBlob);
        const full = document.createElement('canvas');
        full.width = cutImg.naturalWidth;
        full.height = cutImg.naturalHeight;
        full.getContext('2d').drawImage(cutImg, 0, 0);
        const cut = cropToAlpha(full);
        harmonizeCandle(cut);

        const base = (canvas.height * 0.25) / cut.height;
        const c = {
          cut,
          base,
          scale: base,
          x: canvas.width * START_X[candles.length],
          y: canvas.height * 0.65,
          reflect: 0.15,
          thumb: makeThumb(cut)
        };
        candles.push(c);
        resultCanvas = null;
        stepCandle.style.display = 'none';
        updateReflect(c);
        selectCandle(candles.length - 1);
        showEditMode();
        clearBusy();
        setStatus("Dotknij znicza i przesuń go palcem na płycie.");
        focusStage();
      } catch (err) {
        console.error(err);
        clearBusy();
        setStatus("Nie udało się wyciąć znicza. Spróbuj zrobić zdjęcie przy lepszym świetle.", true);
      }
      e.target.value = '';
    }
    inputCandle.addEventListener('change', handleCandleFile);
    inputCandleCamera.addEventListener('change', handleCandleFile);

    // ---------- Wybór i panel znicza ----------
    function selectCandle(i) {
      selected = i;
      const c = candles[i];
      if (!c) return;
      scaleSlider.min = c.base * 0.3;
      scaleSlider.max = c.base * 3;
      scaleSlider.step = c.base / 50;
      scaleSlider.value = c.scale;
      renderChips();
      render();
    }

    function renderChips() {
      rowChips.innerHTML = '';
      candles.forEach((c, i) => {
        const b = document.createElement('button');
        b.className = 'chip' + (i === selected ? ' selected' : '');
        b.setAttribute('aria-label', 'Znicz ' + (i + 1));
        const im = document.createElement('img');
        im.src = c.thumb;
        b.appendChild(im);
        b.addEventListener('click', () => selectCandle(i));
        rowChips.appendChild(b);
      });
      if (candles.length < MAX_CANDLES) {
        const add = document.createElement('button');
        add.className = 'chip add';
        add.innerText = '➕';
        add.setAttribute('aria-label', 'Dodaj kolejny znicz');
        add.addEventListener('click', () => { addModal.style.display = 'flex'; });
        rowChips.appendChild(add);
      }
      deleteBtn.style.display = candles.length > 1 ? 'block' : 'none';
      fitBar();
    }

    function showEditMode() {
      bar.style.display = 'block';
      rowChips.style.display = 'flex';
      rowSize.style.display = 'flex';
      rowEditBtns.style.display = 'flex';
      rowResultBtns.style.display = 'none';
      renderChips();
      fitBar();
    }

    function showResultMode() {
      rowChips.style.display = 'none';
      rowSize.style.display = 'none';
      rowEditBtns.style.display = 'none';
      rowResultBtns.style.display = 'flex';
      fitBar();
    }

    for (const id of ['modal-camera', 'modal-gallery']) {
      document.getElementById(id).addEventListener('click', () => { addModal.style.display = 'none'; });
    }
    document.getElementById('modal-cancel').addEventListener('click', () => { addModal.style.display = 'none'; });

    deleteBtn.addEventListener('click', () => {
      if (candles.length <= 1 || selected < 0) return;
      candles.splice(selected, 1);
      selectCandle(Math.min(selected, candles.length - 1));
    });

    function candleRect(c) {
      const w = c.cut.width * c.scale;
      const h = c.cut.height * c.scale;
      return { w, h, x0: c.x - w / 2, y0: c.y - h / 2 };
    }

    function surfaceInfo(c) {
      const { w, h, x0, y0 } = candleRect(c);
      const sx = Math.max(0, Math.round(x0));
      const sy = Math.max(0, Math.round(y0 + h * 0.95));
      const sw = Math.min(graveCanvas.width - sx, Math.round(w));
      const sh = Math.min(graveCanvas.height - sy, Math.round(h * 0.4));
      if (sw < 4 || sh < 4) return null;

      const t = document.createElement('canvas');
      t.width = 48;
      t.height = 24;
      const tc = t.getContext('2d');
      tc.drawImage(graveCanvas, sx, sy, sw, sh, 0, 0, 48, 24);
      const d = tc.getImageData(0, 0, 48, 24).data;
      let sum = 0, sum2 = 0;
      const n = d.length / 4;
      for (let i = 0; i < d.length; i += 4) {
        const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        sum += l;
        sum2 += l * l;
      }
      const mean = sum / n;
      const std = Math.sqrt(Math.max(0, sum2 / n - mean * mean));
      return { mean, std };
    }

    function updateReflect(c) {
      if (!c || !graveCanvas) return;
      const info = surfaceInfo(c);
      if (!info) { c.reflect = 0.15; return; }
      if (info.mean < 80 && info.std < 22) c.reflect = 0.3;
      else if (info.mean < 110 && info.std < 32) c.reflect = 0.18;
      else c.reflect = 0.06;
    }

    function autoSettings() {
      let polishedCount = 0;
      let minH = Infinity;
      const k = 512 / Math.max(canvas.width, canvas.height);
      for (const c of candles) {
        const info = surfaceInfo(c);
        if (info && info.mean < 90 && info.std < 25) polishedCount++;
        minH = Math.min(minH, candleRect(c).h * k);
      }
      const polished = polishedCount * 2 >= candles.length;
      return {
        shadowStrength: polished ? 0.5 : 0.4,
        realism: minH < 80 ? 0.2 : 0.35
      };
    }

    function drawOrder() {
      return [...candles].sort((a, b) => (a.y + candleRect(a).h / 2) - (b.y + candleRect(b).h / 2));
    }

    function drawCandlesPlain(c) {
      for (const cd of drawOrder()) {
        const { w, h, x0, y0 } = candleRect(cd);
        c.drawImage(cd.cut, x0, y0, w, h);
      }
    }

    function drawComposite(c) {
      c.drawImage(graveCanvas, 0, 0);
      if (!candles.length) return;
      const order = drawOrder();

      // Odbicia
      for (const cd of order) {
        if (cd.reflect <= 0) continue;
        const { w, h, x0, y0 } = candleRect(cd);
        const rh = Math.max(2, Math.round(h * 0.5));
        const refl = document.createElement('canvas');
        refl.width = Math.max(2, Math.round(w));
        refl.height = rh;
        const rc = refl.getContext('2d');
        rc.translate(0, h);
        rc.scale(1, -1);
        rc.drawImage(cd.cut, 0, 0, w, h);
        rc.setTransform(1, 0, 0, 1, 0, 0);
        rc.globalCompositeOperation = 'destination-in';
        const g = rc.createLinearGradient(0, 0, 0, rh);
        g.addColorStop(0, `rgba(0,0,0,${cd.reflect})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        rc.fillStyle = g;
        rc.fillRect(0, 0, refl.width, rh);
        c.drawImage(refl, x0, y0 + h);
      }

      // Cienie kontaktowe
      for (const cd of order) {
        const { w, h, y0 } = candleRect(cd);
        c.save();
        c.translate(cd.x, y0 + h);
        c.scale(1, 0.22);
        const rw = w * 0.8;
        const rg = c.createRadialGradient(0, 0, 0, 0, 0, rw);
        rg.addColorStop(0, 'rgba(0,0,0,0.7)');
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = rg;
        c.fillRect(-rw, -rw, rw * 2, rw * 2);
        c.restore();
      }

      // Znicze z cieniem
      for (const cd of order) {
        const { w, h, x0, y0 } = candleRect(cd);
        c.save();
        c.shadowColor = 'rgba(0,0,0,0.45)';
        c.shadowBlur = w * 0.06;
        c.shadowOffsetX = w * 0.04;
        c.shadowOffsetY = h * 0.01;
        c.drawImage(cd.cut, x0, y0, w, h);
        c.restore();
      }
    }

    function drawSelection(c) {
      const cd = candles[selected];
      if (!cd) return;
      const { w, h, x0, y0 } = candleRect(cd);
      const lw = Math.max(2, canvas.width * 0.006);
      const pad = lw * 3;
      c.save();
      c.lineWidth = lw;
      c.strokeStyle = '#f5c26b';
      c.setLineDash([lw * 3, lw * 2]);
      c.strokeRect(x0 - pad, y0 - pad, w + pad * 2, h + pad * 2);
      c.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (resultCanvas) {
        ctx.drawImage(resultCanvas, 0, 0);
      } else if (graveCanvas) {
        drawComposite(ctx);
        if (candles.length) drawSelection(ctx);
      }
    }

    // ---------- 3. AI Inpainting ----------
    function silhouetteOf(cd, color) {
      const { w, h } = candleRect(cd);
      const sil = document.createElement('canvas');
      sil.width = Math.ceil(w);
      sil.height = Math.ceil(h);
      const sc = sil.getContext('2d');
      sc.drawImage(cd.cut, 0, 0, sil.width, sil.height);
      sc.globalCompositeOperation = 'source-in';
      sc.fillStyle = color;
      sc.fillRect(0, 0, sil.width, sil.height);
      return sil;
    }

    function drawDilated(mc, sil, x0, y0, r) {
      mc.drawImage(sil, x0, y0);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        mc.drawImage(sil, x0 + Math.cos(a) * r, y0 + Math.sin(a) * r);
        mc.drawImage(sil, x0 + Math.cos(a) * r * 0.5, y0 + Math.sin(a) * r * 0.5);
      }
    }

    function buildMask() {
      const m = document.createElement('canvas');
      m.width = canvas.width;
      m.height = canvas.height;
      const mc = m.getContext('2d');
      mc.fillStyle = '#000';
      mc.fillRect(0, 0, m.width, m.height);

      mc.fillStyle = '#fff';
      for (const cd of candles) {
        const { w, h, x0, y0 } = candleRect(cd);
        const pad = w * 0.4;
        mc.fillRect(x0 - pad, y0 + h * 0.6, w + pad * 2, h * 0.4 + h * 0.5);
      }
      for (const cd of candles) {
        const { w, x0, y0 } = candleRect(cd);
        drawDilated(mc, silhouetteOf(cd, '#000'), x0, y0, Math.max(3, w * 0.02));
      }
      return m;
    }

    function buildCandleMask() {
      const m = document.createElement('canvas');
      m.width = canvas.width;
      m.height = canvas.height;
      const mc = m.getContext('2d');
      mc.fillStyle = '#000';
      mc.fillRect(0, 0, m.width, m.height);
      for (const cd of candles) {
        const { w, x0, y0 } = candleRect(cd);
        drawDilated(mc, silhouetteOf(cd, '#fff'), x0, y0, Math.max(4, w * 0.03));
      }
      return m;
    }

    async function callAI(srcCanvas, maskFull, W, H, prompt, negative, strength) {
      const aiCanvas = document.createElement('canvas');
      aiCanvas.width = W;
      aiCanvas.height = H;
      aiCanvas.getContext('2d').drawImage(srcCanvas, 0, 0, W, H);

      const maskSmall = document.createElement('canvas');
      maskSmall.width = W;
      maskSmall.height = H;
      maskSmall.getContext('2d').drawImage(maskFull, 0, 0, W, H);

      const res = await fetch(AI_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          negative_prompt: negative,
          image: aiCanvas.toDataURL('image/png').split(',')[1],
          mask: maskSmall.toDataURL('image/png').split(',')[1],
          width: W,
          height: H,
          strength
        })
      });

      const contentType = res.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        const json = await res.json();
        throw new Error(json.error || 'Nieznany błąd workera');
      }
      if (!res.ok) throw new Error(`Błąd HTTP ${res.status}`);

      const img = await loadImage(await res.blob());
      return { img, maskSmall, aiCanvas };
    }

    function maskDiff(aiCanvas, resultImg, maskSmall, W, H) {
      const t = document.createElement('canvas');
      t.width = W;
      t.height = H;
      const tc = t.getContext('2d');
      tc.drawImage(resultImg, 0, 0, W, H);
      const a = tc.getImageData(0, 0, W, H).data;
      const b = aiCanvas.getContext('2d').getImageData(0, 0, W, H).data;
      const m = maskSmall.getContext('2d').getImageData(0, 0, W, H).data;
      let sum = 0, n = 0;
      for (let i = 0; i < m.length; i += 4) {
        if (m[i] > 200) {
          sum += (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2])) / 3;
          n++;
        }
      }
      return n ? sum / n : 0;
    }

    function makeLayer(resultImg, maskSmall, opacity) {
      const cw = canvas.width, ch = canvas.height;
      const layer = document.createElement('canvas');
      layer.width = cw;
      layer.height = ch;
      const lc = layer.getContext('2d');
      lc.drawImage(resultImg, 0, 0, cw, ch);
      const ld = lc.getImageData(0, 0, cw, ch);

      const up = document.createElement('canvas');
      up.width = cw;
      up.height = ch;
      const uc = up.getContext('2d');
      uc.drawImage(maskSmall, 0, 0, cw, ch);
      const md = uc.getImageData(0, 0, cw, ch).data;
      for (let i = 0; i < ld.data.length; i += 4) {
        ld.data[i + 3] = md[i] * opacity;
      }
      lc.putImageData(ld, 0, 0);
      return layer;
    }

    inpaintBtn.addEventListener('click', async () => {
      if (!candles.length) return;
      inpaintBtn.disabled = true;
      const many = candles.length > 1;

      try {
        const cw = canvas.width, ch = canvas.height;
        const k = 512 / Math.max(cw, ch);
        const W = Math.max(256, Math.round(cw * k / 8) * 8);
        const H = Math.max(256, Math.round(ch * k / 8) * 8);
        const auto = autoSettings();

        setBusy("Tworzę realistyczną wizualizację…\nDopasowuję cień i odbicie (ok. 30 s)");
        const r1 = await callAI(
          canvas, buildMask(), W, H,
          "soft natural shadows and glossy reflections on polished black granite slab, empty stone surface, photorealistic, outdoor daylight",
          "candle, lantern, glass, flame, object, text, watermark, blurry, deformed",
          auto.shadowStrength
        );
        const d1 = maskDiff(r1.aiCanvas, r1.img, r1.maskSmall, W, H);
        const op1 = d1 < 45 ? 1 : d1 < 70 ? 0.6 : 0.35;
        const layer1 = makeLayer(r1.img, r1.maskSmall, op1);

        const stage1 = document.createElement('canvas');
        stage1.width = cw;
        stage1.height = ch;
        const s1 = stage1.getContext('2d');
        drawComposite(s1);
        s1.drawImage(layer1, 0, 0);
        drawCandlesPlain(s1);

        let final = stage1;

        setBusy("Tworzę realistyczną wizualizację…\n" + (many ? "Wtapiam znicze w scenę" : "Wtapiam znicz w scenę"));
        const r2 = await callAI(
          stage1, buildCandleMask(), W, H,
          "realistic glass grave candle lanterns on a black granite tombstone in a cemetery, natural outdoor daylight, consistent lighting, photorealistic, same objects",
          "different object, deformed, extra objects, text, watermark, blurry",
          0.35
        );
        const d2 = maskDiff(r2.aiCanvas, r2.img, r2.maskSmall, W, H);
        const trust = d2 < 22 ? 1 : d2 < 35 ? 0.6 : d2 < 50 ? 0.3 : 0;
        const op2 = auto.realism * trust;
        if (op2 > 0) {
          const layer2 = makeLayer(r2.img, r2.maskSmall, op2);
          final = document.createElement('canvas');
          final.width = cw;
          final.height = ch;
          final.getContext('2d').drawImage(stage1, 0, 0);
          final.getContext('2d').drawImage(layer2, 0, 0);
        }

        resultCanvas = final;
        render();
        showResultMode();
        clearBusy();
        setStatus("✨ Gotowe! Zapisz zdjęcie albo popraw ustawienie zniczy.");
        focusStage();
      } catch (err) {
        console.error("Błąd AI:", err);
        clearBusy();
        setStatus("Nie udało się stworzyć wersji AI. Możesz zapisać podgląd albo spróbować ponownie za chwilę.", true);
      }
      inpaintBtn.disabled = false;
    });

    undoBtn.addEventListener('click', () => {
      resultCanvas = null;
      showEditMode();
      render();
      setStatus("Dotknij znicza i przesuń go palcem albo zmień jego wielkość.");
    });

    scaleSlider.addEventListener('input', (e) => {
      const c = candles[selected];
      if (!c) return;
      c.scale = parseFloat(e.target.value);
      updateReflect(c);
      render();
    });

    function getCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const f = canvas.width / rect.width;
      return { x: (clientX - rect.left) * f, y: (clientY - rect.top) * f, f };
    }

    function hitTest(pos) {
      const pad = 24 * pos.f;
      const order = candles
        .map((c, i) => ({ c, i, bottom: c.y + candleRect(c).h / 2 }))
        .sort((a, b) => b.bottom - a.bottom);
      for (const { c, i } of order) {
        const { w, h, x0, y0 } = candleRect(c);
        if (pos.x >= x0 - pad && pos.x <= x0 + w + pad && pos.y >= y0 - pad && pos.y <= y0 + h + pad) return i;
      }
      return -1;
    }

    function canDrag() { return candles.length > 0 && !resultCanvas; }

    function startDrag(pos) {
      const i = hitTest(pos);
      if (i < 0) return false;
      if (i !== selected) selectCandle(i);
      const c = candles[i];
      drag = { active: true, dx: c.x - pos.x, dy: c.y - pos.y };
      return true;
    }

    function moveDrag(pos) {
      const c = candles[selected];
      if (!drag.active || !c) return;
      c.x = pos.x + drag.dx;
      c.y = pos.y + drag.dy;
      render();
    }

    function endDrag() {
      if (!drag.active) return;
      drag.active = false;
      updateReflect(candles[selected]);
      render();
    }

    canvas.addEventListener('touchstart', (e) => {
      if (!canDrag()) return;
      const pos = getCoords(e.touches[0].clientX, e.touches[0].clientY);
      if (startDrag(pos)) e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!drag.active) return;
      e.preventDefault();
      moveDrag(getCoords(e.touches[0].clientX, e.touches[0].clientY));
    }, { passive: false });

    canvas.addEventListener('touchend', endDrag);
    canvas.addEventListener('touchcancel', endDrag);

    canvas.addEventListener('mousedown', (e) => {
      if (!canDrag()) return;
      startDrag(getCoords(e.clientX, e.clientY));
    });
    window.addEventListener('mousemove', (e) => {
      if (drag.active) moveDrag(getCoords(e.clientX, e.clientY));
    });
    window.addEventListener('mouseup', endDrag);

    function save() {
      let src = resultCanvas;
      if (!src) {
        src = document.createElement('canvas');
        src.width = canvas.width;
        src.height = canvas.height;
        drawComposite(src.getContext('2d'));
      }
      const link = document.createElement('a');
      link.download = 'wizualizacja-nagrobek.jpg';
      link.href = src.toDataURL('image/jpeg', 0.95);
      link.click();
    }
    downloadBtn.addEventListener('click', save);
    downloadResultBtn.addEventListener('click', save);

    window.addEventListener('resize', fitBar);
  </script>
</body>
</html>
